## Server Properties
server.port=8081
server.compression.enabled=true
spring.config.import=file:.env[.properties]
server.servlet.context-path=/data-in-cloud
server.error.include-stacktrace=never
logging.pattern.dateformat=
## Spring Boot Properties
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
## MySQL Configuration
spring.datasource.url=${DB_MYSQL_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
## Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
# Initialize the datasource with available DDL and DML scripts
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
## MongoDB Configuration
spring.data.mongodb.uri=${DB_MONGO_URL}
logging.level.org.springframework.data.mongodb=ERROR
## Azure Blob Storage Configuration
azure.storage.account-name=${AZURE_ACCOUNT_NAME}
azure.storage.container-name=${AZURE_BLOB_CONTAINER_NAME}
azure.storage.account-key=${AZURE_ACCOUNT_KEY}
## Azure Event Hub Configuration
spring.cloud.azure.compatibility-verifier.enabled=false
spring.cloud.stream.bindings.output.contentType=application/json
spring.cloud.stream.bindings.input.contentType=application/json
spring.cloud.function.definition=postEventStreamConsumer
spring.cloud.stream.bindings.postEventStreamConsumer-in-0.destination=${AZURE_EVENT_HUB_NAME}
spring.cloud.stream.bindings.postEventStreamConsumer-in-0.group=$Default
spring.cloud.azure.eventhubs.connection-string=${AZURE_EVENT_HUB_CONNECTION_STRING}
spring.cloud.stream.bindings.output.destination=${AZURE_EVENT_HUB_NAME}
spring.cloud.stream.bindings.input.destination=${AZURE_EVENT_HUB_NAME}
spring.cloud.stream.container.connection-string=${AZURE_EVENT_HUB_CONTAINER_CONNECTION_STRING}
## Spring Docker Properties
spring.docker.compose.file=./docker-compose.yml
## Jackson Properties
spring.jackson.serialization.fail-on-empty-beans=false
